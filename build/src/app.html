<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="katex.css">
<script src="katex.min.js"></script>
<script src="mp.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lilith Learning Lab</title>
<style>
:root{--bg:#0f0b18;--bg2:#171025;--panel:#1b1429;--panel2:#261b3b;--line:#3a2d55;--tx:#f1ebff;--dim:#a99dc7;--g:#b26bff;--g2:#d9acff;--pink:#e06aa8;--warn:#e3b341;--err:#ff7a9a;--ok:#7be0a4;--blue:#6bb6ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 70% -10%,#2a1748 0%,transparent 60%),var(--bg)}
header{flex:none;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
h1{font-size:17px;margin:0;color:var(--g2);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--dim)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;font-size:19px}
.bar{flex:none;height:4px;background:var(--panel2);margin:0 14px 4px;border-radius:2px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--pink));width:0;transition:width .3s}
main{flex:1;min-height:0;overflow:auto;padding:6px 14px 18px;-webkit-overflow-scrolling:touch}
main.fill{overflow:hidden;padding:4px 10px 6px}
nav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:8px 2px 7px;font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px}
nav button b{font-size:19px;line-height:1.1}
nav button.on{color:var(--g2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--g)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.btn,.chip{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;min-height:40px}
button.btn.pri{background:linear-gradient(135deg,var(--g),var(--pink));color:#1a0a2a;border-color:transparent;font-weight:700}
button.btn.sm,.chip{padding:5px 11px;font-size:13px;min-height:34px}
.chip.on{border-color:var(--g);color:var(--g2)}
.chap{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:8px 0;width:100%;text-align:left;color:var(--tx);font:inherit}
.chap .n{min-width:32px;height:32px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;color:var(--g2)}
.chap.done .n{background:var(--g);color:#1a0a2a}
.chap small{display:block;color:var(--dim);font-size:12px}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:#0b0813;border:1px solid var(--line);border-radius:5px;padding:0 4px}
pre{position:relative;background:#0b0813;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;margin:10px 0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
pre code{background:none;border:0;padding:0;font-size:inherit}
pre .lang{position:absolute;top:4px;right:8px;font-size:10px;color:var(--dim)}
pre .cp{position:absolute;bottom:4px;right:6px;font-size:11px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
figure{margin:10px 0}figure img{width:100%;height:auto;border-radius:12px;display:block;background:#fff}
figcaption{font-size:12px;color:var(--dim);margin-top:4px}
.qa{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.qa .a{display:none;margin-top:8px;color:var(--g2)}.qa.open .a{display:block}
input[type=text],input[type=search],textarea,select{width:100%;background:#07040d;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px ui-monospace,Menlo,Consolas,monospace}
textarea{min-height:190px;font-size:14px;line-height:1.45;resize:vertical}
.tblw{overflow-x:auto;margin:10px 0}table.tb{border-collapse:collapse;width:100%;font-size:13.5px}table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.tb th{background:rgba(178,107,255,.16)}
.muted{color:var(--dim);font-size:13px}.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gl dt{font-weight:600;color:var(--g2);margin-top:10px}.gl dd{margin:2px 0 0}
.big{font-size:18px;margin:6px 0}
/* terminal + lab */
.term{background:#05030a;border:1px solid var(--line);border-radius:var(--r);padding:10px;height:50vh;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.term .dim{color:var(--dim)}.term .ok{color:var(--ok)}.term .err{color:var(--err)}.term .warn{color:var(--warn)}.term .cmd{color:var(--g2)}
.prompt{display:flex;gap:6px;align-items:center;margin-top:8px}.prompt span{color:var(--g2);font:13px ui-monospace,Menlo,monospace;white-space:nowrap}
.out{background:#07040d;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.out .p{color:var(--ok)}.out .f{color:var(--err)}.out .g{color:var(--warn)}
/* teacher */
.teacherBox{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#3a1f66 0%,#1b1030 60%,#120a22 100%);border:1px solid var(--line);display:flex;justify-content:center;align-items:flex-end}
.teacherBox img.teacher{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;display:block;filter:drop-shadow(0 6px 18px rgba(178,107,255,.35))}
.teacherBox .tag{position:absolute;left:8px;top:8px;font-size:11px;letter-spacing:.6px;color:var(--g2);background:rgba(15,11,24,.7);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.teacherBox .live{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--dim)}
.teacherBox.talk .live{background:var(--ok);box-shadow:0 0 0 0 rgba(123,224,164,.7);animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(123,224,164,0)}100%{box-shadow:0 0 0 0 rgba(123,224,164,0)}}
.hero{height:300px;margin-top:6px}
/* lecture */
.lec{height:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"t c" "s s" "k k";gap:8px}
.lec .teacherBox{grid-area:t;height:27vh;min-height:150px;aspect-ratio:540/643}
.slideWrap{grid-area:s;position:relative;min-height:0;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#21163a,#150d27);border:1px solid var(--line)}
.slide{position:absolute;inset:0;padding:14px 16px;overflow:auto;display:flex;flex-direction:column}
.slide.enter{animation:slin .45s cubic-bezier(.2,.8,.2,1)}.slide.enterback{animation:slinb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slin{from{opacity:0;transform:translateX(34px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slinb{from{opacity:0;transform:translateX(-34px) scale(.98)}to{opacity:1;transform:none}}
.sh{margin:0 0 10px;color:var(--g2);font-size:15px;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sh:before{content:"";width:22px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--g),var(--pink))}
.bl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.b{display:flex;gap:11px;align-items:flex-start;margin:0;transition:opacity .35s,filter .35s}
.b.hid{opacity:0;transform:translateY(12px);pointer-events:none;position:absolute;visibility:hidden}
.b.pop{animation:bpop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bpop{from{opacity:0;transform:translateX(-22px) scale(.96)}to{opacity:1;transform:none}}
.b:not(.now){opacity:.62}.b.now{opacity:1}
.dot{flex:none;width:12px;height:12px;margin-top:7px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--pink));box-shadow:0 0 0 0 rgba(178,107,255,.7)}
.b.now .dot{animation:pulse2 1.4s infinite}
@keyframes pulse2{70%{box-shadow:0 0 0 9px rgba(178,107,255,0)}100%{box-shadow:0 0 0 0 rgba(178,107,255,0)}}
.bh{display:block;font-size:clamp(17px,4.6vw,24px);line-height:1.25;font-weight:650}
.bd{display:block;font-size:clamp(13px,3.5vw,16px);color:var(--dim);margin-top:3px;opacity:0}
.b.now .bd,.b.shown .bd{animation:fadein .6s .35s forwards}
.b:not(.now) .bd{opacity:.9;animation:none}
@keyframes fadein{to{opacity:1}}
.s-title{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.s-title h2{font-size:clamp(26px,8vw,44px);line-height:1.1;margin:6px 0 12px;background:linear-gradient(90deg,#fff,var(--g2),var(--pink),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.kicker{color:var(--pink);letter-spacing:2px;text-transform:uppercase;font-size:13px}
.rule{width:90px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--g),var(--pink));animation:grow .8s both}
@keyframes grow{from{width:0}}
.orb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;animation:float 7s ease-in-out infinite}
.o1{width:140px;height:140px;background:var(--g);right:-30px;top:-10px}.o2{width:110px;height:110px;background:var(--pink);left:10px;bottom:-30px;animation-delay:-3s}
@keyframes float{50%{transform:translate(-14px,16px)}}
.fig img{width:100%;height:auto;max-height:100%;border-radius:12px;animation:zoom .7s cubic-bezier(.2,.8,.2,1);background:#fff}
@keyframes zoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.fig .cap{font-size:12.5px;color:var(--dim);margin-top:8px}
.codeblk{background:#08050f;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-word}
.ln{display:block;opacity:0;transform:translateX(-10px);animation:lnin .35s forwards;animation-delay:calc(var(--d)*130ms)}
.ln.c{color:#8c82a8}
@keyframes lnin{to{opacity:1;transform:none}}
.q{font-size:clamp(18px,5vw,26px);font-weight:650;line-height:1.25}
.ans{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--g);background:rgba(178,107,255,.12);font-size:clamp(15px,4vw,19px)}
.ans:not(.hid){animation:bpop .5s}
.think{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--dim)}
.ring{width:34px;height:34px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--g);stroke-dasharray:100;stroke-dashoffset:100;stroke-linecap:round}
.think.run .fg{animation:ringgo 3.2s linear forwards}@keyframes ringgo{to{stroke-dashoffset:0}}
.hid.think,.hid.ans{display:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:.2}}
.mapsvg{width:100%;height:100%;display:block}
.mapsvg .e{fill:none;stroke:var(--dim);stroke-width:1.8;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease,stroke .3s}
.mapsvg .e:not(.on){marker-end:none}.mapsvg .e.on{stroke-dashoffset:0}.mapsvg .e.now{stroke:var(--pink);stroke-width:2.8}
.mapsvg .n{opacity:0;transition:opacity .5s}.mapsvg .n.on{opacity:1}
.mapsvg .n rect{fill:#241a3c;stroke:var(--g);stroke-width:1.5}.mapsvg .n.link rect{stroke:var(--pink)}.mapsvg .n.now rect{fill:#3a2560}
.mapsvg .n text{fill:var(--tx);font-size:12.5px}
.mapsvg .el{opacity:0;transition:opacity .5s}.mapsvg .el.on{opacity:1}.mapsvg .el rect{fill:#120a22;stroke:var(--line)}.mapsvg .el text{fill:var(--g2);font-size:10.5px}
.mapsvg.all .e{stroke-dashoffset:0;transition:none}.mapsvg.all .n,.mapsvg.all .el{opacity:1;transition:none}
.caps{grid-area:c;min-height:0;align-self:center;max-height:27vh;overflow:auto;font-size:13.5px;color:var(--tx);background:rgba(38,27,59,.92);border:1px solid var(--g);border-radius:16px 16px 16px 4px;padding:9px 12px;display:block;position:relative}
.caps.hide{visibility:hidden}
.caps b{display:block;color:var(--g2);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.ctl{grid-area:k;display:flex;align-items:center;gap:6px;justify-content:space-between}
.ctl .btn{padding:0;width:44px;height:44px;font-size:18px;display:grid;place-items:center}
.ctl .play{width:58px;height:58px;font-size:24px}
.ctl .meta{font-size:11.5px;color:var(--dim);text-align:center;min-width:64px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--pink));width:0;transition:width .4s}
/* wide screens (desktop browsers): centre the app and give the lecture room */
@media (min-width:860px) and (min-height:561px){
  body{align-items:center}
  header,.bar,main,.dock,nav{width:100%;max-width:1040px}
  header{padding-left:22px;padding-right:22px}
  main{padding:8px 22px 22px}
  nav{border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0}
  nav button{flex-direction:row;justify-content:center;gap:8px;min-height:50px;font-size:13.5px}
  .lec{grid-template-columns:minmax(260px,32%) 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"t s" "c s" "k k";gap:14px}
  .lec .teacherBox{height:100%;aspect-ratio:auto;min-height:0}
  .caps{align-self:stretch;max-height:none}
}
@media (orientation:landscape) and (max-height:560px){
  .lec{grid-template-columns:30% 1fr;grid-template-rows:1fr auto auto;grid-template-areas:"t s" "c s" "k k"}
  .lec .teacherBox{height:100%;aspect-ratio:auto;min-height:0}
  .caps{align-self:stretch;max-height:none}
  nav button{min-height:44px;flex-direction:row;justify-content:center;gap:6px}
  header{padding-top:4px;padding-bottom:2px}
}
/* office hours */
dialog#office{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:18px;padding:12px;width:min(720px,96vw);height:min(90vh,calc(100vh - 20px));max-height:100vh;box-sizing:border-box}
dialog#office[open]{display:flex;flex-direction:column}dialog#office::backdrop{background:rgba(0,0,0,.62)}
.ofc{display:flex;flex-direction:column;height:100%;min-height:380px}#askhost .ofc{height:calc(100vh - 230px)}
.ofm{flex:1;min-height:120px;overflow:auto;padding:4px 2px}.ofl{margin:2px 2px 6px}
.ob{margin:8px 0;padding:10px 12px;border-radius:14px;max-width:94%;overflow-wrap:anywhere}.ob.u{background:var(--panel2);margin-left:auto;border:1px solid var(--line)}.ob.a{background:var(--panel);border:1px solid var(--line)}
.ob .st{font-size:12px;margin-bottom:4px}
.ofchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ofin{display:flex;gap:8px;align-items:flex-end}.ofin textarea{flex:1;resize:none;min-height:46px}
.fl{display:block;margin:8px 0;font-size:13px;color:var(--dim)}.fl input,.fl select{display:block;width:100%;box-sizing:border-box;margin-top:3px}
/* dock for read-aloud */
.dock{flex:none;display:none;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(180deg,#26193f,#1b1229);border-top:1px solid var(--line)}
.dock.on{display:flex}
.dock .teacherBox{width:54px;height:54px;flex:none;border-radius:12px}
.dock .teacherBox img.teacher{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.dock .teacherBox .tag,.dock .teacherBox .live{display:none}
.dock .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.3;max-height:2.7em;overflow:hidden}
.dock .btn{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px}
/* maps */
.mapbox{background:#120a22;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:58vh}
.mapbox svg{display:block}
.mapbox .e{fill:none;stroke:var(--dim);stroke-width:1.6}
.mapbox .n{cursor:pointer}.mapbox .n rect{fill:#241a3c;stroke:var(--g);stroke-width:1.5}.mapbox .n.link rect{stroke:var(--pink)}.mapbox .n.sel rect{fill:#4a2d7a;stroke:#fff}
.mapbox .n text{fill:var(--tx);font-size:12.5px;pointer-events:none}
.mapbox .el rect{fill:#120a22;stroke:var(--line)}.mapbox .el text{fill:var(--g2);font-size:10.5px}
.mapbox .e.hl{stroke:var(--pink);stroke-width:2.8}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--g)}.sw.on:after{left:23px;background:#fff}
.rm *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
a{color:var(--blue)}

/* v2: progress, library, quiz options, labs */
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:5px;border-radius:3px;background:var(--panel2)}.pips i.on{background:linear-gradient(90deg,var(--g),var(--pink))}
.pbar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--pink))}
.chap .pct{margin-left:auto;font-size:12px;color:var(--g2);white-space:nowrap}
.chap .mid{flex:1;min-width:0}
.crs{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;margin:10px 0}
.crs.cur{border-color:var(--g)}
.crs h4{margin:0;font-size:16px;color:var(--g2)}.crs .muted{margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;font-size:clamp(14px,3.9vw,17px);width:100%}
.opt b{flex:none;width:24px;height:24px;border-radius:50%;background:#150d27;display:grid;place-items:center;font-size:12px;color:var(--g2)}
.opt.ok{border-color:var(--ok);background:rgba(123,224,164,.14)}.opt.bad{border-color:var(--err);background:rgba(255,122,154,.14)}
.opt:disabled{opacity:1}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--g);background:rgba(178,107,255,.12);font-size:clamp(13px,3.7vw,16px)}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--err)}
.fb.hid{display:none}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}.katex{font-size:1.08em}
.qmeta{margin-top:8px;font-size:12px;color:var(--dim)}
.pl{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pl button{display:flex;gap:10px;align-items:center;text-align:left}
.kind{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--g);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.fillp{font-size:16px;line-height:2.2}.fillp input{display:inline-block;width:9.5em;max-width:60vw;padding:3px 8px;margin:0 3px;font-size:15px;border-radius:8px}
.fillp input.ok{border-color:var(--ok)}.fillp input.bad{border-color:var(--err)}
.ordl{display:flex;flex-direction:column;gap:6px;margin:8px 0}.ordl button{text-align:left}

<script>
(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
// Fuzzy course search: every query word must match some word in the text, by substring, prefix,
// a small edit distance (typos), or in-order letters ("trnsfmr"). Returns a score, 0 = no match.
function fzEdit(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = [], cur = [], i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++) {
    cur = [i]; let best = i;
    for (j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < best) best = cur[j]; }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function fzNorm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function fuzzyScore(query, text) {
  const q = fzNorm(query).split(/[^a-z0-9]+/).filter(Boolean);
  if (!q.length) return 1;
  const t = fzNorm(text), words = t.split(/[^a-z0-9]+/).filter(Boolean);
  let total = 0;
  for (const w of q) {
    let best = 0;
    if (t.indexOf(w) >= 0) best = words.some(x => x === w) ? 10 : words.some(x => x.indexOf(w) === 0) ? 8 : 6;
    if (!best && w.length >= 3) {
      const max = w.length <= 4 ? 1 : w.length <= 8 ? 2 : 3;
      for (const x of words) {
        const d = Math.min(fzEdit(w, x, max), fzEdit(w, x.slice(0, w.length + 1), max));
        if (d <= max) best = Math.max(best, 5 - d);
        if (best >= 4) break;
      }
      if (!best && w.length >= 4) {
        for (const x of words) {
          let k = 0;
          for (let i = 0; i < x.length && k < w.length; i++) if (x[i] === w[k]) k++;
          if (k === w.length && x[0] === w[0]) { best = 2; break; }
        }
      }
    }
    if (!best) return 0;
    total += best;
  }
  return total;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const LM = LilithMath, inline = s => LM.render(s), cap = s => LM.caption(s);
const N = LilithNarrate, M = LilithMaps, S = LilithSlides, K = LilithCourse, X = LilithXdc, ICONS = LilithIcons;
const LET = 'ABCDEFGH';

/* ---------- icons (Material Design, bundled) ---------- */
$('#sprite').innerHTML = Object.keys(ICONS).map(k => '<symbol id="i-' + k + '" viewBox="0 0 24 24">' + ICONS[k] + '</symbol>').join('');
const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const setIcon = (sel, n) => { const e = $(sel); if (e) e.innerHTML = ic(n); };
setIcon('#libbtn', 'library_books'); setIcon('#askbtn', 'help_outline'); setIcon('#gear', 'settings'); setIcon('#dprev', 'skip_previous'); setIcon('#dnext', 'skip_next'); setIcon('#dclose', 'close'); setIcon('#dplay', 'play_arrow');
const NAVI = { lecture: 'school', read: 'menu_book', maps: 'account_tree', practice: 'science', ask: 'lightbulb', progress: 'insights' };
$$('#nav button').forEach(b => { $('.pill', b).innerHTML = ic(NAVI[b.dataset.t]); });
const KIND = { fill: 'Fill in', order: 'Order', match: 'Match', write: 'Write', code: 'Code', python: 'Python', terminal: 'Terminal', webxdc: 'App' };

/* ---------- storage: course library + progress ---------- */
const IDX = 'lilith-lab-v1', CKEY = id => 'lilith-course:' + id;
let mem = null;
function loadIdx() { try { const v = localStorage.getItem(IDX); if (v) return JSON.parse(v); } catch (e) {} return mem || {}; }
let ST = loadIdx();
ST.courses = ST.courses || []; ST.prog = ST.prog || {}; ST.current = ST.current || null;
ST.set = Object.assign({ rate: 1, readCode: false, captions: true, autoNext: true, voice: null }, ST.set || {});
const memCourses = {};
function save() { mem = ST; try { localStorage.setItem(IDX, JSON.stringify(ST)); return true; } catch (e) { return false; } }
/* courses live in IndexedDB (localStorage holds only about 5 MB, too small for the big courses); memCourses is the sync cache */
const CDB = { db: null, open() { return new Promise(res => { try { const r = indexedDB.open('lilith-courses', 1); r.onupgradeneeded = () => r.result.createObjectStore('c'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch (e) { res(null); } }); },
  put(c) { return new Promise(res => { try { const t = this.db.transaction('c', 'readwrite'); t.objectStore('c').put(c, c.id); t.oncomplete = () => res(true); t.onerror = t.onabort = () => res(false); } catch (e) { res(false); } }); },
  del(id) { try { this.db.transaction('c', 'readwrite').objectStore('c').delete(id); } catch (e) {} },
  all() { return new Promise(res => { try { const r = this.db.transaction('c').objectStore('c').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch (e) { res([]); } }); } };
function readCourse(id) { if (memCourses[id]) return memCourses[id]; try { const v = localStorage.getItem(CKEY(id)); if (v) return JSON.parse(v); } catch (e) {} return null; }
function writeCourse(c) {
  memCourses[c.id] = c;
  if (CDB.db) { CDB.put(c).then(ok => { if (ok) { try { localStorage.removeItem(CKEY(c.id)); } catch (e) {} } else toast('Could not save the course on this device'); }); return true; }
  try { localStorage.setItem(CKEY(c.id), JSON.stringify(c)); return true; } catch (e) { return false; }
}
const coursesReady = (async function () {
  CDB.db = await CDB.open(); if (!CDB.db) return;
  (await CDB.all()).forEach(c => { if (c && c.id) memCourses[c.id] = c; });
  for (const m of ST.courses) { if (memCourses[m.id]) continue; let c = null; try { const v = localStorage.getItem(CKEY(m.id)); if (v) c = JSON.parse(v); } catch (e) {} if (c && await CDB.put(c)) { memCourses[m.id] = c; try { localStorage.removeItem(CKEY(m.id)); } catch (e) {} } }
})();
if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('rm');

let CUR = null;   // { course, ch: [views], byId }
function setCourse(id) {
  const c = id && readCourse(id);
  if (!c) { CUR = null; ST.current = null; save(); N.setPronounce({}); return; }
  const v = K.validate(c);   // re-validate stored data so a damaged entry cannot crash the app
  if (!v.ok) { CUR = null; return; }
  CUR = { course: v.course, ch: v.course.chapters.map(x => K.chapterView(x, v.course)) };
  ST.current = id; save(); N.setPronounce(v.course.pronounce);
}
function P() {
  const p = ST.prog[CUR.course.id] = ST.prog[CUR.course.id] || {};
  p.st = p.st || {}; p.q = p.q || {}; p.lab = p.lab || {}; p.cards = p.cards || {}; p.drafts = p.drafts || {};
  return p;
}
const chBy = n => CUR && CUR.ch.find(c => c.n === n);
const chIdx = n => CUR ? CUR.ch.findIndex(c => c.n === n) : -1;

/* progress model: a chapter has up to 7 stages */
const STAGES = [['map', 'Map'], ['summary', 'Summary'], ['glossary', 'Glossary'], ['points', 'Key points'], ['lesson', 'Lesson'], ['quiz', 'Quiz'], ['practice', 'Practice']];
function stagesOf(c) {
  return STAGES.filter(s => s[0] === 'map' ? c.maps.length : s[0] === 'summary' ? c.summary : s[0] === 'glossary' ? c.glossary.length : s[0] === 'points' ? c.points : s[0] === 'lesson' ? c.examples.trim() : s[0] === 'quiz' ? c.quiz.length : c.practice.length);
}
function labsDone(c) { const p = P(); return c.practice.filter(l => p.lab[c.id + '/' + l.id]).length; }
function stageDone(c, k) {
  const p = P();
  if (k === 'quiz') return !!(p.q[c.id] && p.q[c.id].done);
  if (k === 'practice') return c.practice.length > 0 && labsDone(c) === c.practice.length;
  return !!(p.st[c.id] && p.st[c.id][k]);
}
function chPct(c) { const ss = stagesOf(c); if (!ss.length) return 0; return Math.round(100 * ss.filter(s => stageDone(c, s[0])).length / ss.length); }
function coursePct() { if (!CUR) return 0; return Math.round(CUR.ch.reduce((a, c) => a + chPct(c), 0) / CUR.ch.length); }
function markStage(c, k) { const p = P(); p.st[c.id] = p.st[c.id] || {}; if (!p.st[c.id][k]) { p.st[c.id][k] = true; save(); } }
function pips(c) { return '<span class="pips">' + stagesOf(c).map(s => '<i class="' + (stageDone(c, s[0]) ? 'on' : '') + '" title="' + s[1] + '"></i>').join('') + '</span>'; }

/* ---------- small UI helpers ---------- */
let toastT = null;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}
function modal(html, mount) { const d = $('#modal'); d.innerHTML = html; if (!d.open) d.showModal(); if (mount) mount(d); return d; }
function closeModal() { const d = $('#modal'); if (d.open) d.close(); }
function ask(msg, ok, detail) {
  return new Promise(res => {
    modal('<h3 class="dh">' + esc(msg) + '</h3>' + (detail ? '<div class="muted">' + esc(detail) + '</div>' : '') + '<div class="row end"><button class="btn txt" id="mno">Cancel</button><button class="btn pri" id="myes">' + esc(ok || 'OK') + '</button></div>', d => {
      $('#mno', d).onclick = () => { closeModal(); res(false); };
      $('#myes', d).onclick = () => { closeModal(); res(true); };
    });
  });
}
function copyText(t, what) {
  const done = () => toast((what || 'Text') + ' copied');
  if (window.AndroidTTS && window.AndroidTTS.copy) { try { window.AndroidTTS.copy(t); return done(); } catch (e) {} }
  try { navigator.clipboard.writeText(t).then(done, () => toast('Copy failed')); } catch (e) { toast('Copy failed'); }
}
function shareText(title, t) {
  if (window.AndroidTTS && window.AndroidTTS.share) { try { window.AndroidTTS.share(title, t); return; } catch (e) {} }
  copyText(t, 'JSON');
}
const btn = (id, icon, label, cls) => '<button class="btn ' + (cls || '') + '" id="' + id + '">' + (icon ? ic(icon) : '') + '<span>' + label + '</span></button>';

/* ---------- teacher avatar + narration ---------- */
const FR = {}; ['neutral', 'happy', 'shy', 'mad', 'sad'].forEach(e => [1, 2, 3, 4].forEach(n => { const i = new Image(); i.src = 'avatar/' + e + n + '.webp'; FR[e + n] = i; }));
let lastFrame = '';
const AV = N.createAvatar((emo, n) => { const f = 'avatar/' + emo + n + '.webp'; if (f === lastFrame) return; lastFrame = f; $$('img.teacher').forEach(i => i.setAttribute('src', f)); });
const ENV = N.makeEnv(window, { onFocusLoss: why => { if (NAR && NAR.state.playing) { NAR.pause(); if (why === 'focusloss') toast('Another app took the sound, so Teacher paused.'); } } });
let mode = null, LEC = null, READ = null;
const NAR = N.createNarrator(ENV, {
  onChunk: (i, c) => { AV.emotion(c.emotion || 'neutral'); if (mode === 'lecture') lecShow(i); else if (mode === 'read') dockShow(c); },
  onSpeaking: on => { AV.speaking(on); $$('.teacherBox').forEach(b => b.classList.toggle('talk', on)); },
  onWord: () => AV.word(),
  onState: s => syncControls(s),
  onFail: why => { toast(why + ' Tap play to try again.'); try { if (window.AndroidTTS && AndroidTTS.restartEngine) AndroidTTS.restartEngine(); } catch (e) {} },
  onDone: () => { if (mode === 'lecture' && LEC && !LEC.tour && ST.set.autoNext) { const nx = nextChapter(LEC.ch.n); if (nx) openLecture(nx.n, true); } }
});
AV.start();
function nextChapter(n) { const i = chIdx(n); return CUR && CUR.ch[i + 1] || null; }
function syncControls(s) {
  const p = $('#lplay'); if (p) p.innerHTML = ic(s.playing ? 'pause' : 'play_arrow');
  const d = $('#dplay'); if (d) d.innerHTML = ic(s.playing ? 'pause' : 'play_arrow');
  const m = $('#lmeta'); if (m && LEC) m.textContent = (s.i + 1) + ' / ' + s.n;
  const pr = $('#lprog'); if (pr && s.n) pr.style.width = Math.round(100 * (s.i + 1) / s.n) + '%';
}
document.addEventListener('visibilitychange', () => { if (document.hidden && NAR.state.playing) NAR.pause(); });
window.addEventListener('pagehide', () => { try { NAR.pause(); } catch (e) {} });
NAR.setRate(ST.set.rate);
if (ENV.setVoice && ST.set.voice) ENV.setVoice(ST.set.voice);

/* ---------- navigation ---------- */
let tab = 'lecture', view = null, readCh = null, practice = 'labs', mapPick = 0, mapSel = null, labSel = null;
const main = $('#main');
$$('#nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.t)));
$('#askbtn').onclick = () => openOffice();
$('#libbtn').onclick = () => { leaveLecture(); view = (view === 'lib' || view === 'store') ? null : 'lib'; render(); };
function go(t) { if (t !== 'lecture') leaveLecture(); tab = t; view = null; if (t === 'read') readCh = null; if (t === 'practice') { labSel = null; } render(); }
function leaveLecture() { if (mode === 'lecture' && NAR.state.playing) NAR.pause(); }
function updateHeader() {
  if (!CUR) { $('#sub').textContent = 'Import a course to begin'; $('#pb').style.width = '0%'; return; }
  const p = coursePct(); $('#sub').textContent = CUR.course.title + ' · ' + p + '% complete'; $('#pb').style.width = p + '%';
}
function render() {
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab && view !== 'lib' && view !== 'store' && view !== 'exam'));
  $('#libbtn').classList.toggle('on', view === 'lib' || view === 'store');
  main.classList.toggle('fill', tab === 'lecture' && !!LEC && view !== 'lib' && view !== 'store' && view !== 'exam');
  main.scrollTop = 0;
  if (view === 'store') renderStore();
  else if (view === 'lib' || !CUR) renderLibrary();
  else if (view === 'exam') renderExam();
  else if (tab === 'lecture') renderLecture();
  else if (tab === 'read') readCh === null ? renderReadList() : renderChapter(readCh);
  else if (tab === 'maps') renderMaps();
  else if (tab === 'practice') renderPractice();
  else if (tab === 'ask') renderAskTab();
  else renderProgress();
  updateHeader();
  $('#dock').classList.toggle('on', mode === 'read' && NAR.state.chunks.length > 0 && tab !== 'lecture');
}
window.__onBack = function () {
  if ($('#office').open) { $('#office').close(); return true; }
  if ($('#modal').open) { closeModal(); return true; }
  if ($('#settings').open) { $('#settings').close(); return true; }
  if (view === 'store') { view = 'lib'; render(); return true; }
  if (view === 'lib' && CUR) { view = null; render(); return true; }
  if (view === 'exam') { if (EXAM && EXAM.stage === 'run' && !EXAM.done) { ask('Leave the exam?', 'Leave', 'Your answers so far are discarded.').then(y => { if (y) { EXAM = null; view = null; render(); } }); return true; } EXAM = null; view = null; render(); return true; }
  if (tab === 'lecture' && LEC) { NAR.stop(); LEC = null; mode = null; render(); return true; }
  if (tab === 'read' && readCh !== null) { readCh = null; render(); return true; }
  if (tab === 'practice' && labSel) { labSel = null; render(); return true; }
  if (tab !== 'lecture') { go('lecture'); return true; }
  return false;
};

/* ================= LIBRARY: import, store, delete ================= */
const GUIDE_PROMPT = 'Create a course for Lilith Learning Lab as ONE JSON file (format "lilith-course", version 1). Subject: <your subject>. Audience: <level>.\n' +
  'Structure: {"format":"lilith-course","version":1,"id":"short-id","title":"","subtitle":"","author":"","pronounce":{"WordAsWritten":"how to say it"},"chapters":[...]}.\n' +
  'Every chapter has: "title"; "maps":[{"title":"","links":["Concept A | relation | Concept B", ...]}] (6-10 links, optionally tag a node "[ch3]" to link to chapter 3); "summary":[2-4 sentences]; "glossary":[{"term":"","def":""}]; "keyPoints":[4-8 short points]; ' +
  '"lesson":[{"type":"text","items":[""]},{"type":"code","lang":"","code":""},{"type":"figure","image":"name.svg","caption":""}] ; "quiz":[3 questions {"q":"","options":["","",""],"answer":0,"explain":""}] (answer is the 0-based index of the right option); "cards":[{"q":"","a":""}]; and "practice":[labs].\n' +

const DEFAULT_REPO = 'lucky-edgelord/Lilith-Learning-Lab';

const repoOk = r => /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(r);
const rawBase = r => 'https://raw.githubusercontent.com/' + r + '/main/courses/';
const netCbs = {}; let netId = 0;
window.__netDone = function (id, ok, text) { const f = netCbs[id]; delete netCbs[id]; if (f) f(ok, text); };
function netGet(url) {
  return new Promise((res, rej) => {
    if (window.AndroidTTS && window.AndroidTTS.fetchUrl) {
      const id = ++netId; netCbs[id] = (ok, text) => ok ? res(text) : rej(new Error(text || 'network error'));
      try { window.AndroidTTS.fetchUrl(url, id); } catch (e) { delete netCbs[id]; rej(e); }

      fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(res, rej);
    }
  });
}

/* ---------- markdown (reading mode) ---------- */
function figImg(name) { const svg = CUR.course.images[name]; return svg ? '<img alt="" src="data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '">' : ''; }
function md(src) {
  const lines = src.split('\n'); let html = '', i = 0, list = false, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const closeL = () => { if (list) { html += '</ul>'; list = false; } };
  while (i < lines.length) {
    const ln = lines[i], f = ln.match(/^```(\w*)/), im = ln.trim().match(/^!\[([^\]]*)\]\(images\/([^)]+)\)$/);
    if (f) {
      flushP(); closeL(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      const code = buf.join('\n');
      if (f[1] === 'conceptmap') html += '<div class="muted">Concept map: ' + esc((buf[0] || '').replace('title:', '').trim()) + ' (see the Maps tab)</div>';
      else html += '<pre><span class="lang">' + esc(f[1] || 'text') + '</span><code>' + esc(code) + '</code><button class="cp" data-copy="' + esc(code) + '">copy</button></pre>';
    } else if (im) { flushP(); closeL(); html += '<figure>' + figImg(im[2]) + '<figcaption>' + esc(im[1]) + '</figcaption></figure>'; }
    else if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushP(); closeL(); const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim()); const hd = cells(ln); i += 2; const rws = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rws.push(cells(lines[i])); i++; }
      i--; html += '<div class="tblw"><table class="tb"><thead><tr>' + hd.map(x => '<th>' + inline(x) + '</th>').join('') + '</tr></thead><tbody>' + rws.map(r => '<tr>' + r.map(x => '<td>' + inline(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    else if (/^\s*-\s+/.test(ln)) { flushP(); if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(ln.replace(/^\s*-\s+/, '')) + '</li>'; }
    else if (!ln.trim()) { flushP(); closeL(); } else { closeL(); para.push(ln.trim()); }
    i++;
  }
  flushP(); closeL(); return html;
}

function renderLecture() {
  if (LEC) return renderLecturePlayer();
  const p = P();
  let h = '<div class="teacherBox hero"><span class="tag">TEACHER</span><span class="live"></span><img class="teacher" alt="Teacher" src="avatar/neutral1.webp"></div>';
  h += '<div class="card"><div class="big">' + esc(CUR.course.title) + '</div><div class="muted">' + esc(CUR.course.description || CUR.course.subtitle || 'Pick a chapter. Teacher presents each one as animated slides: concept map, summary, glossary, key points, lesson, then a quiz and practice.') + '</div></div>';
  const last = p.last && chBy(p.last.n), first = last || CUR.ch.find(c => chPct(c) < 100) || CUR.ch[0];
  h += '<div class="row">' + '<button class="btn pri" id="lgo">' + ic('play_arrow') + '<span>' + (last ? 'Resume' : 'Start') + ': ' + esc(first.title.length > 24 ? first.title.slice(0, 22) + '...' : first.title) + '</span></button></div>';
  CUR.ch.forEach(c => {

  });
  h += examCard();
  main.innerHTML = h;
  wireExamCard();
  $('#lgo').onclick = () => openLecture(first.n, true, last && last.n === first.n ? p.last.chunk : 0);
  $$('[data-lec]').forEach(b => b.onclick = () => openLecture(+b.dataset.lec, true));
}

function openLecture(n, autoplay, start, stage) {
  const ch = chBy(n); if (!ch) return;
  NAR.stop();
  mode = 'lecture'; tab = 'lecture'; view = null;
  const deck = S.buildLecture(ch, { readCode: ST.set.readCode, office: officeOn() });
  LEC = { ch, deck, slide: -1, starts: S.slideStarts(deck), qa: {}, tour: false, stageEnd: {} };
  deck.chunks.forEach((c, i) => { LEC.stageEnd[deck.slides[c.slide].stage] = i; });
  let st = start || 0;
  if (stage) { const k = deck.chunks.findIndex(c => deck.slides[c.slide].stage === stage); if (k >= 0) st = k; }
  NAR.load(deck.chunks, st);
  render(); lecShow(st);
  if (autoplay) NAR.play();
}
function openTour(n, mi) {
  const ch = chBy(n), mp = ch && ch.maps[mi]; if (!mp) return;
  NAR.stop(); mode = 'lecture'; tab = 'lecture'; view = null;
  const pseudo = { n: ch.n, id: ch.id, title: 'Concept map tour', maps: [mp], glossary: [], quiz: [], practice: [], raw: { summary: [], keyPoints: [], lesson: [] } };
  const deck = S.buildLecture(pseudo, { label: 'Tour' });
  LEC = { ch, deck, slide: -1, starts: S.slideStarts(deck), qa: {}, tour: true, stageEnd: {}, back: 'maps' };
  NAR.load(deck.chunks, 0); render(); lecShow(0); NAR.play();
}
function exitLecture() { NAR.stop(); const back = LEC && LEC.back; LEC = null; mode = null; if (back) tab = back; render(); }

function slideStep(d) {
  const c = LEC.deck.chunks[NAR.state.i], s = c.slide + d;
  if (s < 0 || s >= LEC.deck.slides.length) return;
  NAR.jump(LEC.starts[s]);
}

const chartLines = code => code.split('\n').map((l, i) => '<span class="ln' + (/^\s*(#|\/\/)/.test(l) ? ' c' : '') + '" style="--d:' + i + '">' + (esc(l) || ' ') + '</span>').join('');
function mapSVG(L, all) {
  let h = '<svg class="mapsvg' + (all ? ' all' : '') + '" viewBox="0 0 ' + L.width + ' ' + L.height + '" preserveAspectRatio="xMidYMid meet">';
  L.edges.forEach((e, i) => { h += '<path class="e" pathLength="1" data-i="' + i + '" d="' + e.d + '" marker-end="url(#mh)"/>'; });
  L.edges.forEach((e, i) => {
    const w = Math.max(30, e.rel.length * 5.6 + 10);
    h += '<g class="el" data-i="' + i + '"><rect x="' + (e.lx - w / 2) + '" y="' + (e.ly - 9) + '" width="' + w + '" height="17" rx="8"/><text x="' + e.lx + '" y="' + (e.ly + 3.5) + '" text-anchor="middle">' + esc(cap(e.rel)) + '</text></g>';
  });
  L.nodes.forEach(n => {
    h += '<g class="n' + (n.ch !== null ? ' link' : '') + '" data-id="' + esc(n.id) + '"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="9"/>';
    n.lines.forEach((t, k) => { h += '<text x="' + (n.x + n.w / 2) + '" y="' + (n.y + 19 + k * 14) + '" text-anchor="middle">' + esc(cap(t)) + '</text>'; });
    h += '</g>';
  });
  return h + '<defs><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs></svg>';
}

let camRaf = null;
function camera(svg, L, a, b) {
  const cur = svg.getAttribute('viewBox').split(' ').map(Number);
  let target;
  if (!a) target = [0, 0, L.width, L.height];
  else {
    const A = L.nodes.find(n => n.id === a), B = L.nodes.find(n => n.id === b);
    let x1 = Math.min(A.x, B.x) - 50, y1 = Math.min(A.y, B.y) - 40, x2 = Math.max(A.x + A.w, B.x + B.w) + 50, y2 = Math.max(A.y + A.h, B.y + B.h) + 40;
    const r = svg.clientWidth / Math.max(1, svg.clientHeight);
    let w = x2 - x1, h = y2 - y1;
    w = Math.max(w, 330); h = Math.max(h, 240);
    if (w / h < r) { const nw = h * r; x1 -= (nw - w) / 2; w = nw; } else { const nh = w / r; y1 -= (nh - h) / 2; h = nh; }
    w = Math.min(w, L.width + 200); h = Math.min(h, L.height + 200);
    target = [x1, y1, w, h];
  }
  if (document.body.classList.contains('rm')) { svg.setAttribute('viewBox', target.join(' ')); return; }
  if (camRaf) cancelAnimationFrame(camRaf);
  const t0 = performance.now(), D = 800;
  (function step(t) {
    const k = Math.min(1, (t - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    svg.setAttribute('viewBox', cur.map((v, i) => v + (target[i] - v) * e).join(' '));
    if (k < 1) camRaf = requestAnimationFrame(step);
  })(t0);
}

/* ----- quiz ----- */
function quizState(el, s, si) {
  const k = LEC.qa[si], fb = $('#fb', el);
  $$('.opt', el).forEach(o => {
    const j = +o.dataset.k; o.disabled = k !== undefined;
    o.classList.toggle('ok', k !== undefined && j === s.answer); o.classList.toggle('bad', k !== undefined && j === k && k !== s.answer);
  });
  if (k === undefined) { fb.classList.add('hid'); return; }
  const fc = LEC.deck.chunks[LEC.starts[si] + 1];
  fb.classList.remove('hid', 'ok', 'bad'); fb.classList.add(k === s.answer ? 'ok' : 'bad');
  fb.innerHTML = '<b>' + esc(fc.label) + '.</b> ' + inline(fc.shown.replace(/^(Correct!|Not quite\.)\s*/, ''));
}
function answerQuiz(si, k) {
  const s = LEC.deck.slides[si]; if (LEC.qa[si] !== undefined) return;
  LEC.qa[si] = k;
  const ok = k === s.answer, fi = LEC.starts[si] + 1, fc = LEC.deck.chunks[fi];
  fc.label = ok ? 'Correct' : 'Not quite';
  fc.shown = (ok ? 'Correct! ' : 'Not quite. The answer is ' + LET[s.answer] + ': ' + s.options[s.answer] + '. ') + (s.explain || '');
  fc.text = N.speakable(fc.shown); fc.emotion = ok ? 'happy' : 'sad';
  quizState($('#slide'), s, si);
  // score
  const qs = LEC.deck.slides.map((x, i) => [x, i]).filter(x => x[0].type === 'quiz');
  if (!LEC.tour && qs.every(x => LEC.qa[x[1]] !== undefined)) {
    const correct = qs.filter(x => LEC.qa[x[1]] === x[0].answer).length, p = P(), old = p.q[LEC.ch.id] || {};
    p.q[LEC.ch.id] = { best: Math.max(old.best || 0, correct), total: qs.length, done: true, last: correct }; save(); updateHeader();
    toast('Quiz score: ' + correct + ' / ' + qs.length);
  }
  const wasHeld = NAR.state.held;
  NAR.jump(fi); if (wasHeld) NAR.play();
}

function lecShow(i) {
  if (!LEC || !$('#slide')) return;
  const c = LEC.deck.chunks[i]; if (!c) return;
  const s = LEC.deck.slides[c.slide], el = $('#slide');
  if (LEC.slide !== c.slide) {
    const dir = c.slide < LEC.slide ? 'enterback' : 'enter';
    el.className = 'slide'; void el.offsetWidth; el.className = 'slide ' + dir;
    el.innerHTML = slideHTML(s, c.slide);
    el.scrollTop = 0; LEC.slide = c.slide;
    if (s.type === 'end') { const nb = $('#nextlec'); if (nb) nb.onclick = () => openLecture(nextChapter(LEC.ch.n).n, true); }
    if (s.type === 'map') LEC.svg = $('svg.mapsvg', el);
    if (s.type === 'quiz') { $$('.opt', el).forEach(o => o.onclick = () => answerQuiz(c.slide, +o.dataset.k)); }
    if (s.type === 'office') { const ab = $('#askhere', el); if (ab) ab.onclick = () => { NAR.pause(); openOffice({ kind: 'section', chId: LEC.ch.id, stage: s.section }); }; }
    if (s.type === 'practice') { $$('[data-lab]', el).forEach(b => b.onclick = () => { NAR.pause(); openLab(LEC.ch.id, b.dataset.lab, true); }); }
  }
  if (s.type === 'bullets') {
    $$('.b', el).forEach(b => {
      const k = +b.dataset.i, was = !b.classList.contains('hid');
      if (k <= c.step) { b.classList.remove('hid'); if (!was) b.classList.add('pop'); b.classList.toggle('now', k === c.step); b.classList.toggle('shown', k < c.step); }
      else { b.classList.add('hid'); b.classList.remove('pop', 'now', 'shown'); }
    });
    const nowEl = $('.b.now', el); if (nowEl && nowEl.scrollIntoView) nowEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else if (s.type === 'quiz') {
    quizState(el, s, c.slide);
  } else if (s.type === 'map' && c.edge !== undefined) {
    const L = s.layout, svg = LEC.svg;
    $$('.e', svg).forEach(p => { const k = +p.dataset.i; p.classList.toggle('on', k <= c.edge); p.classList.toggle('now', k === c.edge); });
    $$('.el', svg).forEach(p => p.classList.toggle('on', +p.dataset.i <= c.edge));
    const shown = {}; L.edges.forEach((e, k) => { if (k <= c.edge) { shown[e.from] = 1; shown[e.to] = 1; } });
    const cur = L.edges[c.edge];
    $$('.n', svg).forEach(n => { n.classList.toggle('on', !cur ? false : !!shown[n.dataset.id]); n.classList.toggle('now', !!cur && (n.dataset.id === cur.from || n.dataset.id === cur.to)); });
    if (cur) camera(svg, L, cur.from, cur.to); else camera(svg, L, null, null);
  }
  const caps = $('#caps');
  if (ST.set.captions) { caps.classList.remove('hide'); caps.innerHTML = '<b>' + esc(c.label) + '</b><span>' + esc(c.shown || '') + '</span>'; } else caps.classList.add('hide');
  // progress bookkeeping
  if (!LEC.tour) {
    Object.keys(LEC.stageEnd).forEach(k => { if (k !== 'title' && k !== 'quiz' && k !== 'practice' && k !== 'end' && LEC.stageEnd[k] <= i) markStage(LEC.ch, k); });
    const p = P(); p.last = { n: LEC.ch.n, chunk: i }; if (c.slide !== LEC._saved) { LEC._saved = c.slide; save(); updateHeader(); }
  } else if (s.type === 'end') { /* tour finished */ }
  syncControls(NAR.state);
}

  CUR.ch.forEach(c => { const pct = chPct(c); h += '<button class="chap ' + (pct === 100 ? 'done' : '') + '" data-n="' + c.n + '"><span class="n">' + (pct === 100 ? ic('check') : c.n) + '</span><span class="mid">' + esc(c.title) + '<small>' + esc(firstSentence(c.summary || '')) + '</small></span></button>'; });
  main.innerHTML = h;
  $$('.chap').forEach(b => b.onclick = () => { readCh = +b.dataset.n; render(); });
}
function renderChapter(n) {
  const i = chIdx(n), c = CUR.ch[i];
  let h = '<div class="row">' + btn('back', 'arrow_back', 'Chapters', 'sm') + '<span class="muted">Chapter ' + c.n + '</span></div>';
  h += '<h2 style="margin:10px 0 0">' + esc(c.title) + '</h2>';
  h += '<div class="row" style="margin:8px 0">' + btn('listen', 'volume_up', 'Read aloud', 'pri') + btn('lectureit', 'school', 'Lecture', '') + '</div>';
  if (c.maps.length) h += '<div class="card"><h3>Concept maps</h3><div class="row">' + c.maps.map((m, k) => '<button class="btn sm tonal" data-map="' + k + '">' + ic('account_tree') + '<span>' + esc(m.title) + '</span></button>').join('') + '</div></div>';

  if (c.glossary.length) h += '<div class="card"><h3>Glossary</h3><dl class="gl">' + c.glossary.map(g => '<dt>' + esc(g.term) + '</dt><dd>' + inline(g.def) + '</dd>').join('') + '</dl></div>';
  if (c.points) h += '<div class="card"><h3>Key points</h3>' + md(c.points) + '</div>';
  if (c.examples.trim()) h += '<div class="card"><h3>Lesson</h3>' + md(c.examples) + '</div>';
  if (c.quiz.length) { const q = P().q[c.id]; h += '<div class="card"><h3>Quiz</h3><div class="muted">' + c.quiz.length + ' questions' + (q ? '. Best score ' + q.best + ' / ' + q.total : '') + '</div><div class="row" style="margin-top:8px">' + btn('doquiz', 'quiz', q ? 'Take it again' : 'Take the quiz', 'pri') + '</div></div>'; }
  if (c.practice.length) h += '<div class="card"><h3>Practice</h3><div class="pl">' + c.practice.map(l => '<button class="btn tonal" data-lab="' + esc(l.id) + '">' + ic(l.type === 'terminal' ? 'terminal' : (l.type === 'code' || l.type === 'python') ? 'code' : 'extension') + '<span>' + esc(l.title) + '</span><span class="kind">' + KIND[l.type] + '</span>' + (P().lab[c.id + '/' + l.id] ? ic('check_circle', 'okc') : '') + '</button>').join('') + '</div></div>';
  if (c.references && c.references.length) h += '<div class="card"><h3>References</h3><ul class="refs">' + c.references.map(r => '<li>' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>' : esc(r.title)) + (r.note ? ' <span class="muted">' + esc(r.note) + '</span>' : '') + '</li>').join('') + '</ul></div>';
  if (c.cards.length) { h += '<div class="card"><h3>Check yourself</h3>'; c.cards.forEach(q => { h += '<div class="qa"><div>' + inline(q.q) + '</div><div class="a">' + inline(q.a) + '</div><button class="btn sm" style="margin-top:6px">Show answer</button></div>'; }); h += '</div>'; }
  h += '<div class="row" style="margin:14px 0">' + btn('mark', 'done_all', 'Mark text sections as read', 'tonal') + btn('askch', 'help_outline', 'Office hours: ask Teacher', 'tonal') + '</div>';
  h += '<div class="row">' + (i > 0 ? btn('prev', 'chevron_left', 'Previous', '') : '') + (i < CUR.ch.length - 1 ? btn('next', 'chevron_right', 'Next', 'pri') : '') + '</div>';
  main.innerHTML = h;
  $('#back').onclick = () => { readCh = null; render(); };
  $('#mark').onclick = () => { ['map', 'summary', 'glossary', 'points', 'lesson'].forEach(k => markStage(c, k)); toast('Marked as read'); updateHeader(); };
  $('#listen').onclick = () => { NAR.stop(); mode = 'read'; READ = { ch: c }; NAR.load(N.buildChunks(c, { readCode: ST.set.readCode }), 0); render(); NAR.play(); };
  $('#lectureit').onclick = () => openLecture(c.n, true);
  $('#askch').onclick = () => openOffice({ kind: 'chapter', chId: c.id });

function renderTerminal(root, lab, key) {

    const tl = T.term.tasks;
    root.innerHTML = (tl.length ? '<ul class="tasks">' + tl.map(t => '<li class="' + (T.term.state.done[t.id] ? 'ok' : '') + '">' + ic(T.term.state.done[t.id] ? 'check_circle' : 'radio_button_unchecked') + ' ' + esc(t.text) + '</li>').join('') + '</ul>' : '') +
      '<div class="term" id="tout">' + T.html + '</div>' +
      '<form class="prompt" id="tf"><span>' + esc(lab.prompt) + '</span><input type="text" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command"></form>' +
      '<div class="chips">' + ((lab.chips && lab.chips.length ? lab.chips : ['help']).concat(tl.length ? ['tasks', 'hint'] : [])).map(c => '<button class="chip" data-c="' + esc(c) + '">' + esc(c.length > 34 ? c.slice(0, 32) + '...' : c) + '</button>').join('') + '</div>' +
      '<div class="muted">A simulation: nothing here touches a real device. Chips fill the prompt; press enter to run.</div>';
    const o = $('#tout', root); o.scrollTop = o.scrollHeight; const inp = $('#tin', root);
    $$('.chip[data-c]', root).forEach(b => b.onclick = () => { inp.value = b.dataset.c; inp.focus(); });
    let hidx = -1;
    $('#tf', root).onsubmit = e => {
      e.preventDefault(); const line = inp.value; inp.value = '';
      T.html += '<span class="cmd">' + esc(lab.prompt) + ' ' + esc(line) + '</span>\n';
      const r = T.term.exec(line); T.ran++;
      if (r === 'CLEAR') T.html = ''; else r.forEach(x => { T.html += '<span class="' + x.c + '">' + esc(x.t) + '</span>\n'; });
      const done = T.term.tasks.length ? T.term.tasks.every(t => T.term.state.done[t.id]) : false;
      draw();
      if (done && key !== 'sandbox' && !P().lab[CUR.ch.find(c => c.practice.some(l => c.id + '/' + l.id === key)).id + '/' + lab.id]) { labDone(key); toast('Lab complete'); }
      $('#tin', root).focus();
    };
    inp.onkeydown = e => {
      const hh = T.term.state.hist;
      if (e.key === 'ArrowUp' && hh.length) { hidx = hidx < 0 ? hh.length - 1 : Math.max(0, hidx - 1); inp.value = hh[hidx]; e.preventDefault(); }
      if (e.key === 'ArrowDown' && hh.length) { hidx = hidx < 0 ? -1 : Math.min(hh.length, hidx + 1); inp.value = hh[hidx] || ''; e.preventDefault(); }
    };
  };
  draw();
}

    '<div class="row" style="margin:8px 0" id="aipv">' + [['ollama', 'Ollama (local)'], ['cloud', 'Ollama Cloud'], ['openai', 'OpenAI-compatible']].map(p => '<button class="chip ' + (c.provider === p[0] ? 'on' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
    '<div id="aif"></div>' +
    sw('search', 'Web search and fetch', c.search) + sw('decide', 'Decisions API (graded explanations)', c.decide) + sw('office', 'Pause for office hours after each lecture section', ST.set.office !== false) + sw('verbose', 'Verbose log (every request and tool call)', c.verbose) +
    '<div class="muted" style="margin-top:8px">Optional: use a different model for each job. Leave blank to use the model above. The provider stays the same.</div>' + field('aibm', 'Course generation model', c.builderModel, 'same as above', 'text') + field('aiom', 'Office hours model', c.officeModel, 'same as above', 'text') +
    '<label class="fl">Decision model (Ollama; cloud default: clef)<input type="text" id="aidm" list="aidms" value="' + esc(c.decideModel || '') + '" placeholder="clef" autocapitalize="off" spellcheck="false"></label><datalist id="aidms"></datalist>' + (isWeb ? field('aicp', 'CORS proxy (web version: needed for Ollama Cloud)', c.corsProxy, 'https://your-worker.workers.dev/?{url}') + '<div class="muted">Ollama Cloud does not let web pages call it directly. Deploy the small proxy in docs/proxy/cloudflare-worker.js (free) and paste its address, or use the Android app, which needs none.</div>' : '') +
    '<div class="out hide" id="aires"></div><div class="row" style="margin-top:10px">' + btn('ailog', 'format_list_bulleted', 'Log', 'sm') + btn('aiexp', 'share', 'Export settings', 'sm') + btn('aiimp', 'upload_file', 'Import settings', 'sm') + '</div><div class="row end" style="margin-top:8px">' + btn('aitest', 'play_arrow', 'Test', '') + btn('aiok', 'check', 'Save', 'pri') + '</div>');
  let cfg = Object.assign({}, c);
  const form = () => {
    const p = cfg.provider, dl = '<datalist id="aimods"></datalist>';
    $('#aif', d).innerHTML = (p === 'ollama' ? field('aiurl', 'Ollama address', cfg.ollamaUrl, 'http://localhost:11434') + '<div class="muted">On the same computer. Allow this site: set OLLAMA_ORIGINS, or on a phone use your computer\'s LAN address.</div>'
      : p === 'cloud' ? field('aikey', 'Ollama Cloud API key', cfg.cloudKey, 'from ollama.com/settings/keys', 'password')
      : field('aiurl', 'Base URL', cfg.openaiUrl, 'https://api.openai.com/v1') + field('aikey', 'API key', cfg.openaiKey, 'sk-...', 'password')) +
      '<label class="fl">Model<input type="text" id="aimodel" list="aimods" value="' + esc(p === 'openai' ? cfg.openaiModel : p === 'cloud' ? cfg.cloudModel : cfg.ollamaModel) + '" placeholder="pick or type a model" autocapitalize="off" spellcheck="false"></label>' + dl + '<div class="row">' + btn('aiscan', 'replay', 'Scan models', 'sm') + '</div>';
    $('#aiscan', d).onclick = scan;
  };
  const pull = () => {
    const g = id => { const e = $('#' + id, d); return e ? e.value.trim() : null; }, p = cfg.provider;
    if (p === 'ollama') { cfg.ollamaUrl = g('aiurl') || cfg.ollamaUrl; cfg.ollamaModel = g('aimodel') || ''; }
    else if (p === 'cloud') { cfg.cloudKey = g('aikey') || ''; cfg.cloudModel = g('aimodel') || ''; }
    else { cfg.openaiUrl = g('aiurl') || cfg.openaiUrl; cfg.openaiKey = g('aikey') || ''; cfg.openaiModel = g('aimodel') || ''; }
    cfg.decideModel = g('aidm') || ''; cfg.builderModel = g('aibm') || ''; cfg.officeModel = g('aiom') || ''; if (isWeb) cfg.corsProxy = g('aicp') || '';
    AIx.setCfg(cfg);
  };
  const out = (t, bad) => { const o = $('#aires', d); o.classList.remove('hide'); o.textContent = t; o.style.color = bad ? 'var(--err)' : ''; };
  async function scan() {
    pull(); out('Scanning...');
    try {
      const m = await AIx.listModels(); $('#aimods', d).innerHTML = m.map(x => '<option value="' + esc(x) + '">').join('');
      ['aibm', 'aiom'].forEach(id => { const e = $('#' + id, d); if (e) e.setAttribute('list', 'aimods'); });
      let dm = []; try { dm = await AIx.listDecisionModels(); $('#aidms', d).innerHTML = dm.map(x => '<option value="' + esc(x) + '">').join(''); } catch (e) { AIx.log('warn', 'Decision model scan: ' + e.message); }
      out(m.length + ' chat model(s): ' + m.slice(0, 12).join(', ') + (m.length > 12 ? ', ...' : '') + (dm.length ? '\n' + dm.length + ' decision model(s): ' + dm.join(', ') : '') + '\nTap the Model box to pick one.');
      const mi = $('#aimodel', d); if (mi && !mi.value && m.length) mi.value = m[0];
    } catch (e) { out('Could not scan: ' + e.message, true); }
  }
  form();
  $$('[data-p]', d).forEach(b => b.onclick = () => { pull(); cfg = AIx.cfg(); cfg.provider = b.dataset.p; AIx.setCfg({ provider: cfg.provider }); $$('[data-p]', d).forEach(x => x.classList.toggle('on', x === b)); form(); });
  $$('[data-k]', d).forEach(b => b.onclick = () => { const k = b.dataset.k, on = !b.classList.contains('on'); b.classList.toggle('on', on); if (k === 'office') { ST.set.office = on; save(); } else { cfg[k] = on; AIx.setCfg(cfg); } });
  $('#ailog', d).onclick = () => openAILog();
  $('#aiexp', d).onclick = () => { pull(); exportSettings(); };
  $('#aiimp', d).onclick = () => importSettings(() => { closeModal(); openAISettings(); });
  $('#aitest', d).onclick = async () => { pull(); out('Asking the model...'); try { const r = await AIx.complete([{ role: 'user', content: 'Reply with the single word: ready' }], { temperature: 0 }); out('Model says: ' + (r.trim().slice(0, 80) || '(an empty reply: the model may not support chat)')); AIx.log('info', 'Test OK: ' + AIx.model()); } catch (e) { out('Failed: ' + e.message, true); } };
  $('#aiok', d).onclick = () => { pull(); closeModal(); courseIdxCache = null; if (tab === 'ask' || tab === 'lecture') render(); toast(AIx.enabled() ? 'AI ready' : 'Saved (pick a model to finish)'); };
}

/* ---- the research-based course builder ---- */
function openBuilder() {
  if (!AIx.enabled()) { openAISettings(); return; }
  const d = modal('<h3 class="dh">Build a course with AI</h3><div class="muted">Say what you want to learn. Teacher researches it, writes the chapters (lessons, quizzes, flashcards, practice and an ELI5 block), checks its own work and adds the course to your library, with the pages it used in a Sources chapter. Check the facts.</div>' +
    '<label class="fl">Topic<input type="text" id="bt" placeholder="e.g. How vaccines work" autocapitalize="sentences"></label>' +
    '<div class="fl">Your documents (optional)<div class="muted" style="font-size:12px">Add notes, a chapter, slides or an article and the course is built from them: .txt .md .html .docx .pptx .pdf</div><div id="bdl" class="muted"></div><div class="row">' + btn('bdoc', 'upload_file', 'Add documents', '') + '</div><input type="file" id="bdf" class="hide" multiple accept=".txt,.md,.markdown,.csv,.json,.html,.htm,.docx,.pptx,.pdf,text/*"></div>' +
    '<label class="fl">Level<select id="bl"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label>' +
    '<label class="fl">Chapters<select id="bn">' + [3, 4, 5, 6, 8, 10].map(n => '<option ' + (n === 5 ? 'selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
    '<label class="fl">Method<select id="bm"><option value="agent"' + (AIx.cfg().builder !== 'pipeline' ? ' selected' : '') + '>Thorough (best with large models)</option><option value="pipeline"' + (AIx.cfg().builder === 'pipeline' ? ' selected' : '') + '>Quick (works with small models)</option></select></label>' +
    '<div class="hide" id="bprog" style="margin-top:10px"><div class="pbar"><i id="bpbar" style="width:0%"></i></div><div class="row"><span id="bptxt">Starting</span><span class="muted" id="bptime" style="margin-left:auto"></span></div><div class="muted" style="margin-top:4px">This takes a few minutes. You can keep the app open and wait here.</div></div>' +
    '<div class="out hide" id="berr"></div><div class="row end" style="margin-top:12px">' + btn('bx', 'close', 'Cancel', 'txt') + btn('bgo', 'play_arrow', 'Build', 'pri') + '</div>');
  let ctl = null; const docs = [];
  const showDocs = () => { $('#bdl', d).innerHTML = docs.map((x, i) => esc(x.name) + ' (' + Math.max(1, Math.round(x.chars / 1000)) + 'k characters) <a href="#" data-rm="' + i + '">remove</a>').join('<br>'); $$('[data-rm]', d).forEach(a => a.onclick = e => { e.preventDefault(); docs.splice(+a.dataset.rm, 1); showDocs(); }); };
  $('#bdoc', d).onclick = () => $('#bdf', d).click();
  $('#bdf', d).onchange = async e => {
    for (const f of Array.from(e.target.files || [])) { try { docs.push(await AIx.readDocument(f)); } catch (err) { toast(err.message); AIx.log('warn', 'Document: ' + err.message); } }
    e.target.value = ''; showDocs(); const t = $('#bt', d); if (!t.value.trim() && docs.length) t.placeholder = 'Optional: ' + docs[0].name.replace(/\.[a-z0-9]+$/i, '');
  };
  $('#bx', d).onclick = () => { if (ctl) ctl.abort(); closeModal(); };
  d.addEventListener('close', () => { if (ctl) ctl.abort(); }, { once: true });
  $('#bgo', d).onclick = async () => {
    const topic = $('#bt', d).value.trim(); if (!topic && !docs.length) { toast('Say what the course is about, or add a document'); return; }
    ctl = new AbortController(); $('#bprog', d).classList.remove('hide'); $('#berr', d).classList.add('hide'); $('#bgo', d).disabled = true;
    ['#bt', '#bl', '#bn', '#bm'].forEach(x => { const e = $(x, d); if (e) e.disabled = true; });
    const t0 = Date.now(), tick = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); const tt = $('#bptime', d); if (tt) tt.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
    const onProgress = p => { const b = $('#bpbar', d), t = $('#bptxt', d); if (b) b.style.width = p.pct + '%'; if (t) t.textContent = p.text; };
    const unlock = () => { clearInterval(tick); $('#bgo', d).disabled = false; ['#bt', '#bl', '#bn', '#bm'].forEach(x => { const e = $(x, d); if (e) e.disabled = false; }); };
    try {
      const mode = $('#bm', d).value; AIx.setCfg({ builder: mode });
      const course = await AIx.buildCourse({ role: 'builder', topic, docs, level: $('#bl', d).value, chapters: +$('#bn', d).value, mode, courseIndex: courseIdx(), onProgress, signal: ctl.signal });
      clearInterval(tick); closeModal(); importText(JSON.stringify(course), course.title + '.course.json');
    } catch (e) {
      unlock(); $('#bprog', d).classList.add('hide');
      if (e.message === 'Cancelled' || e.name === 'AbortError') return;
      AIx.log('error', 'Course builder: ' + e.message);
      const o = $('#berr', d); o.classList.remove('hide'); o.style.color = 'var(--err)'; o.textContent = 'The course could not be built: ' + e.message + '. Try again, or try a larger model (Settings > AI > Log has details).';
    }
  };
}

/* ---- the AI log ---- */
function openAILog() {
  const d = modal('<h3 class="dh">AI log</h3><div class="muted">What the AI features did on this device (keys are hidden). Turn on Verbose log in AI settings to see every request and tool call.</div><div class="out" id="lgv" style="max-height:52vh;overflow:auto;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace"></div>' +
    '<div class="row end" style="margin-top:10px">' + btn('lgc', 'delete', 'Clear', 'txt') + btn('lgy', 'content_copy', 'Copy', '') + btn('lgx', 'check', 'Close', 'pri') + '</div>');
  const v = $('#lgv', d), show = () => { v.textContent = AIx.logText() || '(empty)'; v.scrollTop = v.scrollHeight; }; show();
  const off = AIx.onLog(show);
  $('#lgx', d).onclick = () => { off(); closeModal(); };
  $('#lgy', d).onclick = () => copyText(AIx.logText(), 'Log');
  $('#lgc', d).onclick = () => { AIx.clearLogs(); show(); };
}

/* ---- settings export and import (app settings, course source and AI settings; API keys only if you ask) ---- */
function settingsBlob(withKeys) {
  return { format: 'lilith-settings', version: 1, exported: new Date().toISOString(), app: { set: Object.assign({}, ST.set), repo: ST.repo || '' }, ai: AIx.exportCfg(withKeys) };
}
function saveTextFile(name, text) {
  if (window.AndroidTTS && window.AndroidTTS.share) { shareText(name, text); return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved ' + name); }
  catch (e) { copyText(text, 'Settings'); }
}
function exportSettings() {
  const d = modal('<h3 class="dh">Export settings</h3><div class="muted">Saves your app settings, course source and AI settings as a JSON file' + (window.AndroidTTS ? ' (share it to Files, Drive or a chat)' : '') + '. Progress and courses are not included.</div>' +
    '<div class="set"><span>Include API keys (keep the file private)</span><button class="sw" id="exk" aria-label="Include API keys"></button></div>' +
    '<div class="row end" style="margin-top:12px">' + btn('exc', 'content_copy', 'Copy', '') + btn('exx', 'close', 'Cancel', 'txt') + btn('exs', 'share', 'Save file', 'pri') + '</div>');
  const k = $('#exk', d); k.onclick = () => k.classList.toggle('on');
  const text = () => JSON.stringify(settingsBlob(k.classList.contains('on')), null, 1);
  $('#exx', d).onclick = closeModal;
  $('#exc', d).onclick = () => { copyText(text(), 'Settings'); closeModal(); };
  $('#exs', d).onclick = () => { saveTextFile('lilith-settings.json', text()); closeModal(); AIx.log('info', 'Settings exported' + (k.classList.contains('on') ? ' with API keys' : '')); };
}
/* returns a list of what changed; throws with a clear message when the file is not valid */
function applySettings(j) {
  if (!j || typeof j !== 'object') throw new Error('This is not a settings file.');
  if (j.format !== 'lilith-settings') throw new Error(j.format === 'lilith-course' ? 'This is a course, not a settings file. Import it from the Library.' : 'This is not a Lilith settings file (format "lilith-settings").');
  if (j.version !== 1) throw new Error('Settings file version ' + j.version + ' is not supported.');
  const changed = [];
  if (j.ai !== undefined) changed.push(...AIx.importCfg(j.ai).map(k => 'AI ' + k));
  if (j.app && typeof j.app === 'object') {
    const s = j.app.set;
    if (s && typeof s === 'object') {
      const allowed = { rate: 'number', readCode: 'boolean', captions: 'boolean', autoNext: 'boolean', voice: 'string', office: 'boolean' };
      for (const k in allowed) if (k in s && (typeof s[k] === allowed[k] || (k === 'voice' && s[k] === null))) {
        if (k === 'rate' && !(s[k] >= 0.5 && s[k] <= 2.5)) continue;
        ST.set[k] = s[k]; changed.push(k);
      }
      NAR.setRate(ST.set.rate);
    }
    if (typeof j.app.repo === 'string' && (j.app.repo === '' || repoOk(j.app.repo))) { ST.repo = j.app.repo === DEFAULT_REPO ? '' : j.app.repo; STORE.cat = null; changed.push('course source'); }
    save();
  }
  courseIdxCache = null;
  return changed;
}
function importSettings(after) {
  const d = modal('<h3 class="dh">Import settings</h3><div class="muted">Choose a lilith-settings.json file or paste its text. Only known settings are taken; your courses and progress are not touched.</div>' +
    '<textarea id="imt" rows="6" placeholder="{&quot;format&quot;: &quot;lilith-settings&quot;, ...}" spellcheck="false" style="width:100%;font:12px ui-monospace,Menlo,Consolas,monospace"></textarea><input type="file" id="imf" accept=".json,application/json,text/plain" class="hide">' +
    '<div class="out hide" id="imr"></div><div class="row end" style="margin-top:12px">' + btn('imp2', 'upload_file', 'Choose file', '') + btn('imx', 'close', 'Cancel', 'txt') + btn('imo', 'check', 'Import', 'pri') + '</div>');
  const res = (t, bad) => { const o = $('#imr', d); o.classList.remove('hide'); o.textContent = t; o.style.color = bad ? 'var(--err)' : ''; };
  $('#imx', d).onclick = closeModal;
  $('#imp2', d).onclick = () => $('#imf', d).click();
  $('#imf', d).onchange = e => { const f = e.target.files[0]; if (!f) return; if (f.size > 512 * 1024) { res('That file is too big to be a settings file.', true); return; } const r = new FileReader(); r.onload = () => { $('#imt', d).value = String(r.result); res('Loaded ' + f.name + '. Press Import.'); }; r.onerror = () => res('Could not read the file.', true); r.readAsText(f); };
  $('#imo', d).onclick = () => {
    let j; try { j = JSON.parse($('#imt', d).value); } catch (e) { res('Not valid JSON: ' + e.message, true); return; }
    try { const ch = applySettings(j); closeModal(); toast(ch.length ? 'Imported ' + ch.length + ' setting(s)' : 'Nothing to import'); if (after) after(); }
    catch (e) { res(e.message, true); AIx.log('warn', 'Settings import refused: ' + e.message); }
  };
}

/* ================= SETTINGS ================= */
$('#gear').onclick = () => {
  const d = $('#settings');
  const kind = ENV.kind === 'android' ? 'Android text-to-speech' : ENV.kind === 'web' ? 'browser voice' : 'silent read-along (no speech engine found)';
  const voices = ENV.voices ? ENV.voices() : [];
  const sw = (k, label) => '<div class="set"><span>' + label + '</span><button class="sw ' + (ST.set[k] ? 'on' : '') + '" data-k="' + k + '" aria-label="' + label + '"></button></div>';
  d.innerHTML = '<h3 class="dh">Settings</h3><div class="muted">Voice: ' + kind + '</div>' +
    '<div class="set"><span>Speech speed</span><span class="row">' + [0.8, 1, 1.2, 1.5, 1.8].map(r => '<button class="chip ' + (ST.set.rate === r ? 'on' : '') + '" data-r="' + r + '">' + r + 'x</button>').join('') + '</span></div>' +
    sw('captions', 'Show captions') + sw('autoNext', 'Continue to the next chapter') + sw('readCode', 'Read code aloud') +
    (voices.length > 1 ? '<div class="set"><span>Voice</span><select id="vsel">' + voices.map(v => '<option ' + (v.name === ST.set.voice ? 'selected' : '') + '>' + esc(v.name) + '</option>').join('') + '</select></div>' : '') +
    '<div class="set"><span>AI: office hours and course builder</span>' + btn('aiset', 'tune', 'AI settings', 'sm') + '</div>' +
    '<div class="set"><span>Settings file</span><span class="row">' + btn('sexp', 'share', 'Export', 'sm') + btn('simp', 'upload_file', 'Import', 'sm') + '</span></div>' +
    '<div class="row end" style="margin-top:12px">' + btn('vtest', 'volume_up', 'Test voice', '') + btn('vlog', 'content_copy', 'Copy audio log', 'tonal') + btn('vclose', 'check', 'Done', 'pri') + '</div>';
  $$('[data-k]', d).forEach(b => b.onclick = () => { const k = b.dataset.k; ST.set[k] = !ST.set[k]; save(); b.classList.toggle('on', ST.set[k]); });
  $$('[data-r]', d).forEach(b => b.onclick = () => { ST.set.rate = +b.dataset.r; save(); NAR.setRate(ST.set.rate); $$('[data-r]', d).forEach(x => x.classList.toggle('on', x === b)); const lr = $('#lrate'); if (lr) lr.textContent = ST.set.rate + 'x'; });
  const vs = $('#vsel'); if (vs) vs.onchange = () => { ST.set.voice = vs.value; save(); ENV.setVoice(vs.value); };
  $('#vlog').onclick = () => copyText('Voice engine: ' + ENV.kind + '\n' + N.diagText(), 'Audio log');
  $('#vtest').onclick = () => { NAR.stop(); mode = 'read'; NAR.load([{ label: 'Test', text: 'Hello, I am Teacher. Welcome to the Lilith Learning Lab.', shown: 'Hello, I am Teacher.', emotion: 'happy' }], 0); NAR.play(); };
  $('#aiset').onclick = () => { d.close(); openAISettings(); };
  $('#sexp').onclick = () => { d.close(); exportSettings(); };
  $('#simp').onclick = () => { d.close(); importSettings(); };
  $('#vclose').onclick = () => d.close();
  d.showModal();
};

/* a course handed over by the web course editor ("Try in the app") */
(function () {
  if (location.hash !== '#import-handoff') return;
  let t = null; try { t = localStorage.getItem('lilith.handoff'); localStorage.removeItem('lilith.handoff'); } catch (e) {}
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (t) setTimeout(() => importText(t, 'course.json'), 300);
})();
window.__app = { N, NAR, AV, ST, K, readCourse, openLecture, openCourse, importText, go, get LEC() { return LEC; }, get CUR() { return CUR; }, get EXAM() { return EXAM; }, ENV, answerQuiz, openLab, openTour };
coursesReady.catch(() => {}).then(() => { setCourse(ST.current || (ST.courses[0] && ST.courses[0].id)); render(); });
})();
