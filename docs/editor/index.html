<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilith Course Editor</title>
<meta name="description" content="Write and edit Lilith Learning Lab courses in your browser: chapters, lessons, quizzes, flashcards, concept maps and practice labs. Free and offline.">
<meta name="theme-color" content="#120a22">
<style>
:root{--bg:#0f0b18;--panel:#1b1429;--panel2:#261b3b;--line:#3a2d55;--tx:#f1ebff;--dim:#a99dc7;--g:#b26bff;--g2:#d9acff;--pink:#e06aa8;--warn:#e3b341;--err:#ff7a9a;--ok:#7be0a4;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--g2)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header .brand{font-weight:700;color:var(--g2);margin-right:auto;white-space:nowrap}
header .brand a{text-decoration:none}
button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--g)}
button.pri{background:var(--g);color:#1b0a33;border-color:var(--g);font-weight:600}
button.sm{padding:3px 9px;min-height:28px;font-size:13px}
button.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:default}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:0;min-height:calc(100% - 58px)}
aside,#issues{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
#issues{border-right:0;border-left:1px solid var(--line)}
main{padding:14px 18px 80px;min-width:0}
.nav{display:block;width:100%;text-align:left;border-radius:10px;margin:3px 0;padding:7px 10px;background:transparent;border:1px solid transparent;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.on{background:var(--panel2);border-color:var(--g)}
.nav .n{color:var(--dim);margin-right:6px}
.nav .bad{color:var(--err);margin-left:4px}
h2{margin:4px 0 12px;font-size:20px;color:var(--g2)}
h3{margin:0;font-size:16px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:0 12px}
details.sec>summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::before{content:'▸';color:var(--dim)}
details.sec[open]>summary::before{content:'▾'}
details.sec>summary .cnt{color:var(--dim);font-weight:400;font-size:13px}
details.sec>.body{padding:0 0 12px}
label.f{display:block;margin:8px 0;color:var(--dim);font-size:13px}
label.f>input,label.f>textarea,label.f>select{display:block;width:100%;margin-top:3px}
input,textarea,select{background:#0b0813;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px}
textarea{resize:vertical;min-height:60px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.item .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .head .t{font-weight:600;margin-right:auto;color:var(--g2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:6px;align-items:start}
.muted{color:var(--dim);font-size:13px}
.hint{color:var(--dim);font-size:12.5px;margin:2px 0 6px}
.issue{font-size:13px;padding:6px 8px;border-radius:8px;margin:5px 0;background:var(--panel);border-left:3px solid var(--warn);cursor:pointer}
.issue.err{border-left-color:var(--err)}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.stats{font-size:13px;color:var(--dim);margin:8px 0}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:min(680px,94vw);width:100%;padding:16px}
dialog::backdrop{background:rgba(5,3,10,.7)}
.jerr{color:var(--err);font-size:12.5px}
.opt{display:flex;gap:6px;align-items:center;margin:4px 0}.opt input[type=text]{flex:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--g);border-radius:999px;padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
@media (max-width:1100px){.layout{grid-template-columns:220px minmax(0,1fr)}#issues{grid-column:1/-1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){header{position:static}.layout{display:block}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}#chlist{display:flex;gap:6px;overflow-x:auto}#chlist .nav{width:auto;flex:none;max-width:200px}main{padding:12px}.grid2{grid-template-columns:1fr}}
</style>
</head><body>
<header>
  <span class="brand"><a href="../">Lilith University</a> / Course editor</span>
  <button id="bNew">New</button><button id="bOpen">Open file</button><button id="bLib">From library</button><button id="bPaste">Paste JSON</button>
  <button id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
  <span id="vstat" class="badge">checking</span>
  <button id="bDown" class="pri">Download</button><button id="bTry" title="Open this course in the web app">Try in the app</button>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="ed"></main>
  <section id="issues"></section>
</div>
<input type="file" id="fin" accept=".json,application/json" hidden>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
/* Lilith Learning Lab: course format (JSON), validation, lab engines.
   Pure functions, no DOM, so the same code runs in the app and in Node tests.

   A course is one JSON file:
   { "format": "lilith-course", "version": 1, "id": "my-course", "title": "...", "subtitle": "...", "author": "...",
     "images": { "fig.svg": "<svg ...>" },
     "chapters": [ {
        "title": "...",                       (required)
        "maps":     [ { "title": "...", "links": ["A [ch2] | relation | B", ...] } ],
        "summary":  ["sentence or paragraph", ...],
        "glossary": [ { "term": "...", "def": "..." } ],
        "keyPoints":["..."],
        "lesson":   [ {"type":"text","items":["..."]}, {"type":"code","lang":"bash","code":"..."},
                      {"type":"figure","image":"fig.svg","caption":"..."}, {"type":"table","title":"...","head":["A","B"],"rows":[["x","y"]]}, {"type":"math","tex":"\\frac{a}{b}"}, {"type":"map","title":"...","links":[...]} ],
        "quiz":     [ { "q": "...", "options": ["a","b","c"], "answer": 1, "explain": "..." } ],
        "cards":    [ { "q": "...", "a": "..." } ],
        "references": [ { "title": "...", "url": "https://...", "note": "what it covers" } ],   (every chapter should have 1+; a table is expected in every lesson)
        "practice": [ labs: fill | order | match | write | code | python | terminal | webxdc ]
     } ],
     "finalExam": { "title": "Final exam", "passMark": 70, "size": 20, "questions": [ same shape as quiz ] },   (optional; a plain list of questions also works.
                  Without it the app builds the exam from every chapter quiz.)
     "sandbox": { a terminal lab, optional free practice terminal },
     "apps": [ { "title": "...", "xdc": "<base64 .xdc>" | "html": "..." } ]    (extra webxdc apps shown in Practice > Apps)
   Practice lab {"type":"webxdc","xdc":"<base64 zip>"|"html":"..."|"files":{...}} runs any interactive webxdc app inside the lab;
   the app can call window.lilith.complete() to mark the lab done. */
(function (root) {
  'use strict';

  var FORMAT = 'lilith-course', VERSION = 1;
  var LAB_TYPES = ['fill', 'order', 'match', 'write', 'code', 'python', 'terminal', 'webxdc'];
  var LIMITS = { chapters: 200, text: 6000, items: 400 };

  function s(x) { return x === null || x === undefined ? '' : String(x); }
  function arr(x) { return Array.isArray(x) ? x : (x === null || x === undefined || x === '' ? [] : [x]); }
  function slug(t) { return s(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'course'; }
  function strs(x) { return arr(x).map(function (v) { return s(v).trim(); }).filter(Boolean); }

  /* ---------- normalising ---------- */
  function linkText(l) {
    if (typeof l === 'string') return l.trim();
    if (l && typeof l === 'object') return s(l.from) + ' | ' + s(l.rel) + ' | ' + s(l.to);
    return '';
  }

  function normMaps(c, w, where) {
    var raw = arr(c.maps).concat(c.map ? [c.map] : []), out = [];
    raw.forEach(function (m, i) {
      if (!m || typeof m !== 'object') return;
      var links = arr(m.links !== undefined ? m.links : m.edges).map(linkText).filter(function (t) { return t.split('|').length === 3; });
      if (!links.length) { w.push(where + ': map ' + (i + 1) + ' has no usable links (use "A | relation | B")'); return; }
      out.push({ title: s(m.title) || 'Concept map', links: links });
    });
    return out;
  }

  function normRefs(x) {
    return arr(x).map(function (r) {
      if (typeof r === 'string') return /^https?:/i.test(r) ? { title: r, url: r, note: '' } : { title: r.trim(), url: '', note: '' };
      if (!r || typeof r !== 'object') return null;
      var url = s(r.url).trim(); if (url && !/^https?:\/\//i.test(url)) url = '';
      var title = s(r.title || r.name).trim() || url; return title ? { title: title.slice(0, 200), url: url, note: s(r.note).trim().slice(0, 300) } : null;
    }).filter(Boolean).slice(0, 12);
  }
  function normBlock(b, w, where) {
    if (typeof b === 'string') return { type: 'text', items: [b] };
    if (!b || typeof b !== 'object') return null;
    var t = s(b.type || (b.code !== undefined ? 'code' : b.image ? 'figure' : b.links ? 'map' : 'text'));
    if (t === 'text') { var it = strs(b.items !== undefined ? b.items : b.text); return it.length ? { type: 'text', items: it } : null; }
    if (t === 'math') { var tex = s(b.tex !== undefined ? b.tex : b.text).trim(); return tex ? { type: 'text', items: ['$$' + tex + '$$'] } : null; }
    if (t === 'code') { var code = s(b.code).replace(/\s+$/, ''); return code ? { type: 'code', lang: s(b.lang) || 'text', code: code } : null; }
    if (t === 'table') {
      var head = strs(b.head !== undefined ? b.head : b.columns), rows = arr(b.rows).map(function (r) { return arr(r).map(function (x) { return s(x).replace(/\|/g, '/').trim(); }); }).filter(function (r) { return r.length; });
      if (!head.length && rows.length) head = rows.shift();
      head = head.map(function (x) { return x.replace(/\|/g, '/'); });
      if (!head.length || !rows.length) { w.push(where + ': table needs "head" (column names) and "rows"'); return null; }
      rows = rows.map(function (r) { while (r.length < head.length) r.push(''); return r.slice(0, head.length); });
      return { type: 'table', title: s(b.title).trim(), head: head, rows: rows.slice(0, 40) };
    }
    if (t === 'figure') { return b.image ? { type: 'figure', image: s(b.image), caption: s(b.caption) } : null; }
    if (t === 'map') { var ms = normMaps({ maps: [b] }, w, where); return ms.length ? { type: 'map', map: ms[0] } : null; }
    w.push(where + ': unknown lesson block type "' + t + '" skipped');
    return null;
  }

  function normQuiz(q, w, where) {
    if (!q || typeof q !== 'object' || !s(q.q).trim()) return null;
    var opts = strs(q.options);
    if (opts.length < 2) { w.push(where + ': quiz question needs at least 2 options'); return null; }
    var a = q.answer;
    if (typeof a === 'string' && !/^\d+$/.test(a)) { var k = opts.map(function (o) { return o.toLowerCase(); }).indexOf(a.trim().toLowerCase()); a = k; }
    a = Number(a);
    if (!(a >= 0 && a < opts.length)) { w.push(where + ': quiz answer must be an option index (0-based) or the option text'); return null; }
    return { q: s(q.q).trim(), options: opts, answer: a, explain: s(q.explain).trim() };
  }

  function normLab(l, w, where, idx) {
    if (!l || typeof l !== 'object') return null;
    var t = s(l.type).toLowerCase();
    if (LAB_TYPES.indexOf(t) < 0) { w.push(where + ': lab type "' + s(l.type) + '" is not supported (use ' + LAB_TYPES.join(', ') + ')'); return null; }
    var lab = { id: s(l.id) || ('lab' + idx), type: t, title: s(l.title) || ('Practice ' + (idx + 1)), intro: s(l.intro), hint: s(l.hint), solution: s(l.solution) };
    if (t === 'fill') {
      lab.text = s(l.text);
      if (!/\{\{[^}]+\}\}/.test(lab.text)) { w.push(where + ': fill lab needs {{answer}} blanks'); return null; }
    } else if (t === 'order') {
      lab.items = strs(l.items); if (lab.items.length < 2) { w.push(where + ': order lab needs at least 2 items'); return null; }
    } else if (t === 'match') {
      lab.pairs = arr(l.pairs).filter(function (p) { return Array.isArray(p) && p.length >= 2; }).map(function (p) { return [s(p[0]), s(p[1])]; });
      if (lab.pairs.length < 2) { w.push(where + ': match lab needs at least 2 pairs ([left, right])'); return null; }
    } else if (t === 'write') {
      lab.prompt = s(l.prompt || l.intro); lab.starter = s(l.starter); lab.lang = s(l.lang);
      lab.checks = arr(l.checks).map(function (c) { return typeof c === 'string' ? { re: c, msg: c } : { re: s(c.re), flags: s(c.flags) || 'i', msg: s(c.msg || c.re), not: !!c.not }; }).filter(function (c) { return c.re; });
      if (!lab.checks.length) { w.push(where + ': write lab needs "checks": [{"re": "...", "msg": "..."}]'); return null; }
    } else if (t === 'code') {
      lab.starter = s(l.starter); lab.fn = s(l.fn); lab.isBody = !!l.isBody; lab.checkJs = s(l.checkJs); lab.helpersJs = s(l.helpersJs);
      lab.tests = arr(l.tests).filter(function (x) { return x && typeof x === 'object'; });
      if (!lab.fn && !lab.isBody) { w.push(where + ': code lab needs "fn" (function name) or "isBody": true'); return null; }
      if (!lab.tests.length && !lab.checkJs) { w.push(where + ': code lab needs "tests" or "checkJs"'); return null; }
    } else if (t === 'python') {
      lab.starter = s(l.starter); lab.fn = s(l.fn);
      lab.tests = arr(l.tests).filter(function (x) { return x && typeof x === 'object'; });
      lab.checks = arr(l.checks).map(function (c) { return typeof c === 'string' ? { re: c, msg: c } : { re: s(c.re), flags: s(c.flags) || 'i', msg: s(c.msg || c.re), not: !!c.not }; }).filter(function (c) { return c.re; });
      if (lab.fn && !/^[A-Za-z_]\w*$/.test(lab.fn)) { w.push(where + ': python lab "fn" must be a plain function name'); return null; }
      if (!(lab.fn && lab.tests.length) && !lab.checks.length) { w.push(where + ': python lab needs "fn" with "tests", or "checks" on the printed output'); return null; }
    } else if (t === 'webxdc') {
      lab.xdc = s(l.xdc).replace(/\s+/g, ''); lab.html = s(l.html);
      lab.files = (l.files && typeof l.files === 'object' && !Array.isArray(l.files)) ? l.files : null;
      lab.height = Math.max(240, Math.min(900, Number(l.height) || 520));
      if (!lab.xdc && !lab.html && !lab.files) { w.push(where + ': webxdc lab needs "xdc" (base64 zip), "html" or "files"'); return null; }
      if (lab.xdc && !/^[A-Za-z0-9+\/=]+$/.test(lab.xdc)) { w.push(where + ': webxdc "xdc" is not valid base64'); return null; }
      if (lab.files && !lab.files['index.html']) { w.push(where + ': webxdc "files" needs an index.html'); return null; }
    } else if (t === 'terminal') {
      lab.prompt = s(l.prompt) || '$'; lab.vars = (l.vars && typeof l.vars === 'object') ? l.vars : {};
      lab.banner = s(l.banner); lab.chips = strs(l.chips);
      lab.commands = arr(l.commands).filter(function (c) { return c && typeof c === 'object' && c.re !== undefined; });
      lab.tasks = arr(l.tasks).filter(function (c) { return c && c.text && c.cmd; });
      if (!lab.commands.length) { w.push(where + ': terminal lab needs "commands"'); return null; }
    }
    return lab;
  }

  function validate(raw) {
    var errors = [], warnings = [];
    if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) { return { ok: false, errors: ['Not valid JSON: ' + e.message], warnings: [] }; } }
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, errors: ['The file must be a JSON object.'], warnings: [] };
    if (raw.format && raw.format !== FORMAT) errors.push('"format" should be "' + FORMAT + '" (found "' + s(raw.format) + '")');
    if (!s(raw.title).trim()) errors.push('"title" is required');
    if (!Array.isArray(raw.chapters) || !raw.chapters.length) errors.push('"chapters" must be a non-empty list');
    if (errors.length) return { ok: false, errors: errors, warnings: warnings };
    var course = {
      format: FORMAT, version: VERSION, id: slug(raw.id || raw.title), title: s(raw.title).trim(), subtitle: s(raw.subtitle).trim(),
      author: s(raw.author).trim(), description: s(raw.description).trim(), teacher: s(raw.teacher).trim(), category: s(raw.category).trim().slice(0, 40), level: s(raw.level).trim().slice(0, 20), tags: Array.isArray(raw.tags) ? raw.tags.filter(function (t) { return typeof t === 'string'; }).slice(0, 12) : [], images: {}, pronounce: {}, chapters: [], sandbox: null, apps: [], exam: null
    };
    if (raw.images && typeof raw.images === 'object') Object.keys(raw.images).forEach(function (k) { if (typeof raw.images[k] === 'string' && /<svg[\s>]/i.test(raw.images[k])) course.images[k] = raw.images[k]; });
    if (raw.pronounce && typeof raw.pronounce === 'object') Object.keys(raw.pronounce).forEach(function (k) { if (typeof raw.pronounce[k] === 'string') course.pronounce[k] = raw.pronounce[k]; });
    raw.chapters.slice(0, LIMITS.chapters).forEach(function (c, i) {
      var where = 'chapter ' + (i + 1);
      if (!c || typeof c !== 'object') { warnings.push(where + ' is not an object; skipped'); return; }
      if (!s(c.title).trim()) { warnings.push(where + ' has no title; skipped'); return; }
      var n = (typeof c.number === 'number') ? c.number : (course.chapters.length ? course.chapters[course.chapters.length - 1].n + 1 : 1);
      where = 'chapter ' + n + ' (' + s(c.title).trim() + ')';
      var gl = c.glossary, glist = [];
      if (gl && !Array.isArray(gl) && typeof gl === 'object') glist = Object.keys(gl).map(function (k) { return { term: k, def: s(gl[k]) }; });
      else glist = arr(gl).filter(function (g) { return g && s(g.term) && s(g.def !== undefined ? g.def : g.definition); }).map(function (g) { return { term: s(g.term).trim(), def: s(g.def !== undefined ? g.def : g.definition).trim() }; });
      var ch = {
        id: s(c.id) || ('ch' + n), n: n, title: s(c.title).trim(),
        maps: normMaps(c, warnings, where), summary: strs(c.summary), glossary: glist, keyPoints: strs(c.keyPoints || c.points),
        lesson: arr(c.lesson).map(function (b) { return normBlock(b, warnings, where); }).filter(Boolean),
        quiz: arr(c.quiz).map(function (q) { return normQuiz(q, warnings, where); }).filter(Boolean),
        cards: arr(c.cards).filter(function (q) { return q && s(q.q) && s(q.a); }).map(function (q) { return { q: s(q.q), a: s(q.a) }; }),
        practice: arr(c.practice).map(function (l, k) { return normLab(l, warnings, where, k); }).filter(Boolean),
        references: normRefs(c.references)
      };
      if (!ch.lesson.some(function (b) { return b.type === 'table'; })) warnings.push(where + ': no table in the lesson (add {"type":"table","title":"...","head":[...],"rows":[[...]]})');
      if (!ch.references.length) warnings.push(where + ': no references (add "references": [{"title":"...","url":"https://...","note":"..."}])');
      // unique lab ids inside a chapter
      var seen = {}; ch.practice.forEach(function (l, k) { var id = l.id; while (seen[id]) id = id + '_' + k; seen[id] = 1; l.id = id; });
      ch.lesson.forEach(function (b) { if (b.type === 'figure' && !course.images[b.image]) warnings.push(where + ': figure "' + b.image + '" is not in "images"'); });
      course.chapters.push(ch);
    });
    course.apps = arr(raw.apps).filter(function (a) { return a && typeof a === 'object' && (a.xdc || a.html || a.files); }).map(function (a, i) { return { id: s(a.id) || ('app' + (i + 1)), title: s(a.title) || ('App ' + (i + 1)), xdc: s(a.xdc).replace(/\s+/g, ''), html: s(a.html), files: a.files && typeof a.files === 'object' ? a.files : null, height: Math.max(240, Math.min(900, Number(a.height) || 520)) }; });
    if (raw.finalExam || raw.exam) {
      var fe = raw.finalExam || raw.exam, fq = Array.isArray(fe) ? fe : arr(fe.questions);
      var exq = fq.map(function (q) { return normQuiz(q, warnings, 'final exam'); }).filter(Boolean);
      if (exq.length) {
        var pm = Array.isArray(fe) ? 70 : Number(fe.passMark), sz = Array.isArray(fe) ? 0 : Number(fe.size);
        course.exam = { title: (!Array.isArray(fe) && s(fe.title).trim()) || 'Final exam', passMark: pm > 0 && pm <= 100 ? Math.round(pm) : 70, size: sz > 0 ? Math.min(Math.round(sz), exq.length) : 0, questions: exq };
      } else warnings.push('"finalExam" has no usable questions; the exam will be built from the chapter quizzes');
    }
    if (raw.sandbox) { var sb = normLab(Object.assign({ type: 'terminal', id: 'sandbox', title: 'Sandbox' }, raw.sandbox), warnings, 'sandbox', 0); if (sb) course.sandbox = sb; }
    if (!course.chapters.length) return { ok: false, errors: ['No usable chapters were found.'], warnings: warnings };
    // every chapter id unique
    var ids = {}; course.chapters.forEach(function (c) { if (ids[c.id]) c.id = c.id + '-' + c.n; ids[c.id] = 1; });
    return { ok: true, errors: [], warnings: warnings, course: course };
  }

    V.warnings.forEach(function (w) {
      var m = /^chapter (\d+)/.exec(w), d = h('div', { cls: 'issue', text: w });
      if (m) d.onclick = function () { sel = { kind: 'ch', i: +m[1] - 1 }; render(); };
      out.appendChild(d);
    });
    if (V.ok && !V.warnings.length) out.appendChild(h('div', { cls: 'ok', text: 'No problems found. The app will import this course.' }));
    renderSide();
  }, 150);
}

/* ---------- files ---------- */
function fileName() { return ((V && V.course && V.course.id) || 'course') + '.course.json'; }
function download() {
  var a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(C, null, 1)], { type: 'application/json' })), download: fileName() });
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Downloaded ' + fileName() + (V && !V.ok ? ' (it still has errors)' : ''));
}
function openText(t, from) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Not valid JSON: ' + e.message); } setCourse(j, 'Opened ' + from); }
function dialog(build) { var d = $('#dlg'); d.textContent = ''; build(d); if (!d.open) d.showModal(); return d; }
function confirmReplace() { return !C.chapters.length || confirm('Replace the course you are editing? (Download it first if you want to keep it. Undo also works.)'); }
$('#bNew').onclick = function () { if (confirmReplace()) setCourse(blank(), 'New course'); };
$('#bOpen').onclick = function () { $('#fin').click(); };
$('#fin').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.size > 25 * 1024 * 1024) { toast('That file is too big.'); return; }
  var r = new FileReader(); r.onload = function () { try { if (confirmReplace()) openText(String(r.result), f.name); } catch (er) { toast(er.message); } }; r.onerror = function () { toast('Could not read the file.'); }; r.readAsText(f);
};
$('#bPaste').onclick = function () {
  dialog(function (d) {
    var ta = h('textarea', { rows: 12, cls: 'mono', style: 'width:100%', placeholder: '{"format": "lilith-course", ...}' }), err = h('div', { cls: 'jerr' });
    d.appendChild(h('h3', { text: 'Paste a course' })); d.appendChild(ta); d.appendChild(err);
    d.appendChild(h('div', { cls: 'row', style: 'justify-content:flex-end;margin-top:10px' }, h('button', { onclick: function () { d.close(); } }, 'Cancel'),
      h('button', { cls: 'pri', onclick: function () { try { openText(ta.value, 'pasted JSON'); d.close(); } catch (e) { err.textContent = e.message; } } }, 'Open')));
  });
};
$('#bLib').onclick = function () {
  dialog(function (d) {
    var box = h('div', { text: 'Loading the course list...' });
    d.appendChild(h('h3', { text: 'Open a course from the library' })); d.appendChild(h('div', { cls: 'hint', text: 'Start from one of the free courses and make it your own.' })); d.appendChild(box);
    d.appendChild(h('div', { cls: 'row', style: 'justify-content:flex-end;margin-top:10px' }, h('button', { onclick: function () { d.close(); } }, 'Close')));
    fetch('../catalog.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).catch(function () { return fetch(RAW + 'catalog.json').then(function (r) { return r.json(); }); }).then(function (cat) {
      box.textContent = '';
      (cat.courses || []).forEach(function (c) {
        box.appendChild(h('button', { cls: 'nav', onclick: function () {
          if (!confirmReplace()) return; box.textContent = 'Downloading ' + c.title + '...';
          fetch((cat.raw || RAW) + c.file).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function (t) { openText(t, c.title); d.close(); }).catch(function (e) { box.textContent = 'Could not download it: ' + e.message; });
        } }, c.title + ' ', h('span', { cls: 'muted', text: c.chapters + ' chapters' })));
      });
    }).catch(function (e) { box.textContent = 'Could not load the course list: ' + e.message; });
  });
};
$('#bUndo').onclick = function () { if (!undo.length) return; var t = undo.pop(); C = JSON.parse(t); last = t; persist(); validate(); render(); $('#bUndo').disabled = !undo.length; toast('Undone'); };
document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#bUndo').onclick(); } });
$('#bDown').onclick = download;
$('#bTry').onclick = function () {
  if (V && !V.ok) { toast('Fix the errors first: ' + V.errors[0]); return; }
  try { localStorage.setItem(HANDOFF, JSON.stringify(C)); } catch (e) { toast('Not enough storage to hand the course over. Download it and import it in the app.'); return; }
  window.open('../app/#import-handoff', '_blank');
};
window.addEventListener('beforeunload', function () { clearTimeout(saveT); snapshot(); persist(); });
window.__editor = { get C() { return C; }, setCourse: setCourse, validate: function () { return V; } };
$('#bUndo').disabled = true;
render(); validate();
})();
</script>
</body></html>
